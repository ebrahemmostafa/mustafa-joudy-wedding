<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3b2e">
  <meta name="color-scheme" content="only light">
  <meta name="robots" content="noindex, nofollow">
  <title>Guest replies</title>
  <link rel="icon" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@400;500&family=Great+Vibes&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; padding: clamp(1rem, 4vw, 2.5rem) 1rem 3rem; }
    .sheet { max-width: 920px; margin: 0 auto; padding: 3rem clamp(1rem, 4vw, 3rem) 2.5rem; box-shadow: 0 20px 50px rgba(0, 0, 0, .35); }
    .head__names { margin: 0; font-family: var(--f-script); font-size: clamp(2.4rem, 9vw, 3.4rem); line-height: 1.1; color: var(--accent); }
    .head__sub { margin: .3rem 0 0; font-family: var(--f-sc); letter-spacing: .14em; font-size: .95rem; color: var(--muted); }

    .lock { max-width: 320px; margin: 2.5rem auto 0; display: grid; gap: 1.2rem; text-align: start; }
    .lock .btn { width: 100%; }
    .lock__error { margin: -.4rem 0 0; min-height: 1.3em; font-size: .95rem; text-align: center; color: #a3261c; }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; margin: 2.2rem 0 1.8rem; }
    .stat { padding: 1rem .5rem .9rem; border: 1px solid var(--paper-edge); background: rgba(255, 255, 255, .45); }
    .stat b { display: block; font-size: clamp(1.9rem, 6vw, 2.6rem); font-weight: 500; line-height: 1; color: var(--accent); font-variant-numeric: lining-nums tabular-nums; }
    .stat span { display: block; margin-top: .45rem; font-family: var(--f-sc); font-size: .85rem; letter-spacing: .1em; color: var(--muted); }
    .stat--no b { color: var(--gold-lo); }

    .tools { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .filters { display: inline-flex; border: 1px solid var(--gold); }
    .filters button { min-height: 40px; padding: 0 .95rem; border: 0; background: transparent; cursor: pointer; font-size: 1rem; color: var(--ink); }
    .filters button + button { border-inline-start: 1px solid var(--gold); }
    .filters button[aria-pressed="true"] { background: var(--accent); color: var(--ivory); }
    .search { flex: 1 1 180px; max-width: 260px; min-height: 40px; padding: .3rem .1rem; border: 0; border-bottom: 1px solid var(--gold-lo); background: transparent; font-size: 1.05rem; }
    .search:focus { outline: none; border-bottom: 2px solid var(--accent); }
    .actions { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-top: 1.8rem; }
    .actions .btn { min-height: 42px; padding: .4rem 1.1rem; font-size: .95rem; }

    .list { margin: 0; padding: 0; list-style: none; text-align: start; border-top: 1px solid var(--paper-edge); }
    .row { display: grid; grid-template-columns: minmax(0, 1.4fr) auto 4.5rem minmax(0, 1fr); gap: .4rem 1rem; align-items: baseline; padding: .95rem .25rem; border-bottom: 1px solid var(--paper-edge); }
    .row__name { font-size: 1.2rem; font-weight: 600; overflow-wrap: anywhere; }
    .row__when { grid-column: 1; font-size: .9rem; color: var(--muted); }
    .pill { justify-self: start; padding: .1rem .6rem; font-family: var(--f-sc); font-size: .85rem; letter-spacing: .08em; border: 1px solid currentColor; white-space: nowrap; }
    .pill--yes { color: var(--accent); }
    .pill--no { color: var(--gold-lo); }
    .row__guests { font-variant-numeric: lining-nums; color: var(--muted); white-space: nowrap; }
    .row__msg { grid-column: 4; grid-row: 1 / span 2; font-style: italic; color: var(--ink); overflow-wrap: anywhere; }
    .empty { padding: 2.5rem 0 1rem; font-style: italic; color: var(--muted); }

    @media (max-width: 640px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .tools { flex-direction: column; align-items: stretch; }
      .filters { align-self: center; }
      .search { flex: none; max-width: none; }
      .row { grid-template-columns: minmax(0, 1fr) auto; }
      .row__guests { grid-column: 2; grid-row: 2; justify-self: end; }
      .row__msg { grid-column: 1 / -1; grid-row: auto; }
    }
  </style>
</head>
<body>
  <main class="paper sheet">
    <p class="head__names" id="names"></p>
    <p class="head__sub" id="sub">Guest replies</p>

    <form class="lock" id="lock">
      <label class="field">
        <span>Passcode</span>
        <input name="passcode" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn--velvet" type="submit">Open the guest list</button>
      <p class="lock__error" id="lockError" role="alert"></p>
    </form>

    <section id="board" hidden>
      <div class="stats">
        <div class="stat"><b id="sReplies">0</b><span>Replies</span></div>
        <div class="stat"><b id="sYes">0</b><span>Attending</span></div>
        <div class="stat"><b id="sGuests">0</b><span>Guests coming</span></div>
        <div class="stat stat--no"><b id="sNo">0</b><span>Declined</span></div>
      </div>

      <div class="tools">
        <div class="filters" role="group" aria-label="Show">
          <button type="button" data-f="all" aria-pressed="true">All</button>
          <button type="button" data-f="yes" aria-pressed="false">Attending</button>
          <button type="button" data-f="no" aria-pressed="false">Declined</button>
        </div>
        <input class="search" id="search" type="search" placeholder="Search by name" aria-label="Search by name">
      </div>

      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden></p>

      <div class="actions">
        <button class="btn btn--line" id="refresh" type="button">Refresh</button>
        <button class="btn btn--line" id="csv" type="button">Download CSV</button>
        <button class="btn btn--line" id="signout" type="button">Lock</button>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script>
  (() => {
    const C = window.INVITE;
    const $ = (s) => document.querySelector(s);
    const TZ = C.timeZone || "Africa/Cairo";
    const KEY = "rsvp-passcode";
    const store = {
      get: () => { try { return sessionStorage.getItem(KEY); } catch { return null; } },
      set: (v) => { try { sessionStorage.setItem(KEY, v); } catch {} },
      clear: () => { try { sessionStorage.removeItem(KEY); } catch {} },
    };
    // device key from the server after a successful open: lets this browser in even
    // when the list is paused for unknown devices after a flood of wrong tries
    const DEVICE = "rsvp-device";
    const device = {
      get: () => { try { return localStorage.getItem(DEVICE); } catch { return null; } },
      set: (v) => { try { localStorage.setItem(DEVICE, v); } catch {} },
    };
    let rows = [], filter = "all", passcode = null;

    $("#names").textContent = `${C.couple.one} & ${C.couple.two}`;
    $("#sub").textContent = "Guest replies · " + new Intl.DateTimeFormat("en-GB", { timeZone: TZ, day: "numeric", month: "long", year: "numeric" }).format(new Date(C.date));

    async function load(code) {
      const res = await fetch(`${C.supabase.url}/rest/v1/rpc/list_rsvps`, {
        method: "POST",
        headers: { apikey: C.supabase.key, "Content-Type": "application/json" },
        body: JSON.stringify({ passcode: code, device: device.get() }),
      });
      if (!res.ok) throw new Error("network");
      const out = await res.json();
      if (!out.ok) throw new Error(out.error); // "passcode", "locked" or "busy"
      if (out.device) device.set(out.device);
      return out.rows;
    }

    async function open(code, quiet) {
      const btn = $("#lock button");
      btn.disabled = true;
      $("#lockError").textContent = "";
      try {
        rows = await load(code);
        passcode = code;
        store.set(code);
        $("#lock").hidden = true;
        $("#board").hidden = false;
        render();
      } catch (e) {
        store.clear();
        const why = {
          passcode: "That passcode isn't right.",
          locked: "Too many wrong tries. Wait 15 minutes, then try again.",
          busy: "The guest list is paused after many wrong tries. Try again in 15 minutes.",
        };
        if (!quiet) $("#lockError").textContent = why[e.message] || "Couldn't reach the guest list. Check your connection and try again.";
      } finally {
        btn.disabled = false;
      }
    }

    const when = (iso) => new Intl.DateTimeFormat("en-GB", { timeZone: TZ, day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }).format(new Date(iso));

    function render() {
      const yes = rows.filter((r) => r.attending);
      $("#sReplies").textContent = rows.length;
      $("#sYes").textContent = yes.length;
      $("#sGuests").textContent = yes.reduce((n, r) => n + (r.guests || 0), 0);
      $("#sNo").textContent = rows.length - yes.length;

      const q = $("#search").value.trim().toLowerCase();
      const shown = rows.filter((r) =>
        (filter === "all" || (filter === "yes") === r.attending) && (!q || r.name.toLowerCase().includes(q)));

      $("#list").replaceChildren(...shown.map((r) => {
        const li = document.createElement("li");
        li.className = "row";
        const name = Object.assign(document.createElement("span"), { className: "row__name", textContent: r.name });
        const pill = Object.assign(document.createElement("span"), {
          className: `pill pill--${r.attending ? "yes" : "no"}`, textContent: r.attending ? "Attending" : "Declined" });
        const guests = Object.assign(document.createElement("span"), {
          className: "row__guests", textContent: r.attending ? `${r.guests} ${r.guests === 1 ? "guest" : "guests"}` : "" });
        const msg = Object.assign(document.createElement("span"), { className: "row__msg", textContent: r.message || "" });
        const at = Object.assign(document.createElement("span"), { className: "row__when", textContent: when(r.created_at) });
        li.append(name, pill, guests, msg, at);
        return li;
      }));
      const empty = $("#empty");
      empty.hidden = shown.length > 0;
      empty.textContent = rows.length ? "No replies match." : "No replies yet.";
    }

    function csv() {
      // guests type names and notes, so anything a spreadsheet would run as a formula stays text
      const cell = (v) => {
        let s = String(v ?? "");
        if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
        return `"${s.replace(/"/g, '""')}"`;
      };
      const lines = [["Name", "Attending", "Guests", "Message", "Replied at (Cairo)"].map(cell).join(",")];
      rows.forEach((r) => lines.push([r.name, r.attending ? "Yes" : "No", r.attending ? r.guests : 0, r.message, when(r.created_at)].map(cell).join(",")));
      const url = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }));
      const a = Object.assign(document.createElement("a"), { href: url, download: "rsvp.csv" });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    $("#lock").addEventListener("submit", (e) => {
      e.preventDefault();
      const code = e.target.passcode.value;
      if (code) open(code);
    });
    document.querySelectorAll(".filters button").forEach((b) => b.addEventListener("click", () => {
      filter = b.dataset.f;
      document.querySelectorAll(".filters button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      render();
    }));
    $("#search").addEventListener("input", render);
    $("#refresh").addEventListener("click", async () => {
      try { rows = await load(passcode); render(); } catch { /* keep the last list */ }
    });
    $("#csv").addEventListener("click", csv);
    $("#signout").addEventListener("click", () => {
      store.clear(); passcode = null; rows = [];
      $("#board").hidden = true; $("#lock").hidden = false; $("#lock").reset();
    });

    const saved = store.get();
    if (saved) open(saved, true);
  })();
  </script>
</body>
</html>
